packages:
  all:
    target: ["x86_64"]
  # Don't build compilers
  c:
    buildable: false
  cxx:
    buildable: false
  fortran:
    buildable: false
  #
  ### Providers
  #
  blas:
    require:: ['openblas']
  fftw-api:
    require:: ['fftw']
  jpeg:
    require: ['libjpeg-turbo']
  lapack:
    require:: ['openblas']
  mkl:
    buildable: false
  xkbdata-api:
    require: ['xkbdata'] # eliminates a million dependencies
  #
  ### Individual package settings
  #
  # Use `require::` to override require's from common/packages.yaml,
  # and `require:<newline>  - '...'` to add to existing ones.
  boost:
    require:: ['@:']
  cdo:
    require:: ['grib2=none']
  crtm:
    require: ['+fix']
  ecmwf-atlas:
    require:: ['+fckit', '~trans', '~fftw']
  ectrans:
    require:: ['+fftw']
  flex:
    require: ['@2.6.4']
  gdal:
    require:: ['~arrow', '~curl']
  gettext:
    require: ['~tar', '~curses', '~git', '~bzip2', '~xz']
  libxslt:
    require: ['~crypto']
  mapl:
    require:: ['~pflogger', '~fargparse', '~extdata2g']
  netcdf-c:
    require:: ['+mpi', '~parallel-netcdf', '~dap', '~blosc', '~szip', '~byterange']
  pango:
    require:: ["@=1.48.11"] # avoid some deps/restrictions (json-glib)
  py-colorama:: {}
  py-pandas:
    require:: ['~excel']
  scotch:
    require::
      - '@7.0.13'
      - +mpi
      - +metis
      - ~shared
      - ~threads
      - ~mpi_thread
      - +noarch
      - +esmumps
      - build_system=cmake
  subversion:
    require: ['+serf']
  zlib-ng:
    require: ['+compat', '~new_strategies']
