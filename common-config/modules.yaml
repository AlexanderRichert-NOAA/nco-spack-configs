modules:
  modules_flat:
    enable:: [lmod]
    lmod:
      hierarchy:: []
      core_compilers:: [gcc,oneapi,intel,intel-oneapi-compilers]
      all:
        autoload: run
    roots:
      lmod: $env/modules/flat
    arch_folder: false
  with_mpi_hierarchy:
    enable:: [lmod]
    lmod:
      hierarchy:: [mpi]
      core_compilers:: [gcc,oneapi,intel,intel-oneapi-compilers]
      all:
        autoload: run
    roots:
      lmod: $env/modules/mpi_hierarchy
    arch_folder: false
